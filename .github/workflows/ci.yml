# The gates of technicalspec.md §33, steps 1 to 10, on every pull request and
# on main. Steps 1 to 9 are the same commands as `pnpm check`, `pnpm test`,
# `pnpm build` and `pnpm e2e` locally, in the order of the spec. Step 10 is
# `pnpm e2e:media`, in Chrome on Windows (e2e-media.yml).
#
# On main only, after step 10 has passed, steps 11 to 15 deploy: first the
# API, then the web app, always in that order. The server rejects fields it
# does not know, so a new client must never reach an old server.
#
# Two builds of the web app are made. Step 8 builds the one the tests run
# against, with the E2E test key. Step 13 builds the one that is deployed,
# without it, and step 14 refuses to deploy a build that holds the key.
#
# The deploy needs, besides VITE_ASSET_BASE_URL:
#   variable  APP_ORIGIN              https://<project>.vercel.app, no trailing slash
#   secrets   RENDER_DEPLOY_HOOK_URL, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No Cargo step needs a database to compile: server/.sqlx/ holds the queries.
  SQLX_OFFLINE: "true"
  # The service container below. The role must be able to create databases:
  # every server integration test makes its own.
  DATABASE_URL: postgres://offcut:offcut@localhost:5432/offcut_dev
  # The asset host. A repository variable: Settings > Secrets and variables >
  # Actions > Variables. It must be the host named in the CSP of web/vercel.json.
  VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL }}
  # The same versions as on the development machine. scripts/build-wasm.sh
  # refuses a wasm-bindgen CLI that differs from the crate in Cargo.lock.
  WASM_BINDGEN_VERSION: 0.2.129
  WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  BINARYEN_VERSION: version_133
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
  GITLEAKS_VERSION: 8.18.4
  GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
  # The public half of the E2E test key (v2implementation D-24): the key of
  # the fixed seed in web/tests-e2e/helpers/fake-api.ts. It is no secret. A
  # build made with it accepts the entitlement tokens the tests mint, so it
  # is given to one build only, the one of step 8, under the name Vite
  # reads. Under this name Vite does not read it, and step 14 searches the
  # build that is deployed for it.
  E2E_TEST_PUBLIC_KEY: mCydb6uLK58faqtJ0v3Ol8tnmNboOoH6t/RD6rcXxxM= # gitleaks:allow

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: offcut
          POSTGRES_PASSWORD: offcut
          POSTGRES_DB: offcut_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offcut -d offcut_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      # --- 1. Checkout, caches, secret scan ---------------------------------
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, for the secret scan.
          fetch-depth: 0

      - name: Check the configuration
        run: |
          if [ -z "$VITE_ASSET_BASE_URL" ]; then
            echo "::error::The repository variable VITE_ASSET_BASE_URL is not set. Set it to the asset host named in the CSP of web/vercel.json."
            exit 1
          fi
          # The value alone: no name, no "=", no spaces, no quotes.
          case "$VITE_ASSET_BASE_URL" in
            *[!A-Za-z0-9._~:/-]* | *//*//*)
              # A variable is no secret, so the value can be shown. %q makes a
              # space or a line break at its end visible.
              printf '::error::The repository variable VITE_ASSET_BASE_URL must hold a URL and nothing else, like https://assets.example.com. It holds %s characters, shown here as the shell reads them: %q\n' "${#VITE_ASSET_BASE_URL}" "$VITE_ASSET_BASE_URL"
              exit 1
              ;;
            https://?*) ;;
            *)
              echo "::error::The repository variable VITE_ASSET_BASE_URL must start with https://"
              exit 1
              ;;
          esac

      - name: Install the Rust toolchain of rust-toolchain.toml
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustc --version
          echo "RUSTC_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up pnpm, the version of package.json
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore the Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUSTC_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUSTC_VERSION }}-

      - name: Restore the pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install the build tools
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          bin="$HOME/.cargo/bin"
          # Downloads a release archive and refuses it unless its checksum is the one above.
          fetch() {
            curl --fail --silent --show-error --location --retry 3 --output "$2" "$1"
            echo "$3  $2" | sha256sum --check --quiet -
          }

          fetch "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl.tar.gz" wasm-bindgen.tar.gz "$WASM_BINDGEN_SHA256"
          tar -xzf wasm-bindgen.tar.gz
          install "wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl/wasm-bindgen" "$bin/wasm-bindgen"

          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz" cargo-deny.tar.gz "$CARGO_DENY_SHA256"
          tar -xzf cargo-deny.tar.gz
          install "cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny" "$bin/cargo-deny"

          fetch "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz" binaryen.tar.gz "$BINARYEN_SHA256"
          tar -xzf binaryen.tar.gz
          install "binaryen-$BINARYEN_VERSION/bin/wasm-opt" "$bin/wasm-opt"

          fetch "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks.tar.gz "$GITLEAKS_SHA256"
          tar -xzf gitleaks.tar.gz gitleaks
          install gitleaks "$bin/gitleaks"

          wasm-bindgen --version
          cargo deny --version
          wasm-opt --version
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --no-banner

      - name: Install the web dependencies
        run: pnpm install --frozen-lockfile

      # --- 2. Rust: format, lint, licenses and bans -------------------------
      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo deny
        run: cargo deny check

      # --- 3. The generated TypeScript matches the Rust types ---------------
      - name: Generate the types
        run: pnpm gen:types

      - name: Check that nothing changed
        run: sh scripts/check-gen-clean.sh

      # --- 4. Rust tests, the server's against the Postgres service ---------
      - name: cargo test
        run: cargo test --workspace

      # --- 5. The WASM bundle -----------------------------------------------
      - name: Build the WASM bundle
        run: pnpm build:wasm

      # --- 6. Web: lint, types, structure, copy -----------------------------
      - name: ESLint
        run: pnpm --filter web exec eslint .

      - name: tsc
        run: pnpm --filter web exec tsc --noEmit

      # The second program of v2implementation D-63: the E2E tests, the bench
      # and the tool configuration files, which may use Node's types.
      - name: tsc, the tests and the tool configuration
        run: pnpm --filter web exec tsc --noEmit -p tests-e2e/tsconfig.json

      - name: File tree, file length, crate dependencies
        run: node scripts/check-file-tree.mjs

      - name: Copy for every code
        run: node scripts/check-copy-codes.mjs

      # --- 7. Web unit tests ------------------------------------------------
      - name: Vitest
        run: pnpm --filter web exec vitest run

      # --- 8. The production build, and the hosts in it ---------------------
      # Built with the E2E test key, for the suites of steps 9 and 10. This
      # build is tested and never deployed.
      - name: Build the web app
        env:
          VITE_ENTITLEMENT_TEST_PUBLIC_KEY: ${{ env.E2E_TEST_PUBLIC_KEY }}
        run: pnpm build:vite

      - name: Hosts in the bundle and in the CSP
        run: node scripts/check-hosts.mjs

      # On every event: the media suites of step 10 run against this build.
      - name: Hand the build to the media suites
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

      # --- 9. End-to-end, in Chrome, against the build ----------------------
      - name: Install Chrome for Playwright
        run: pnpm --filter web exec playwright install --with-deps chrome

      - name: Playwright, the non-media suites
        run: pnpm e2e

      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

      # The deploy job builds the web app again, for Vercel. It takes the two
      # WASM bundles from here, so it needs no Rust toolchain.
      - name: Hand the WASM bundles to the deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg
          retention-days: 1
          if-no-files-found: error

  # --- 10. The media suites, in Chrome on Windows, against the build of step 8
  e2e-media:
    needs: ci
    uses: ./.github/workflows/e2e-media.yml

  # --- 11. The API: build the image, push it, tell Render -------------------
  deploy-api:
    needs: [ci, e2e-media]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-api.yml
    secrets:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  # --- 12 to 15. The web app, once the API runs this commit -----------------
  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The production address of the web app; the same value as APP_ORIGIN in Render.
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      VERCEL_CLI_VERSION: 62.7.0

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the configuration
        run: |
          case "$APP_ORIGIN" in
            *[!A-Za-z0-9.:/-]* | https://*/*)
              printf '::error::The repository variable APP_ORIGIN must hold an address and nothing else, with no path and no trailing slash, like https://offcut.vercel.app. It holds %s characters, shown here as the shell reads them: %q\n' "${#APP_ORIGIN}" "$APP_ORIGIN"
              exit 1
              ;;
            https://?*) ;;
            *)
              echo "::error::The repository variable APP_ORIGIN is not set, or does not start with https://"
              exit 1
              ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # --- 12. The API must run this commit before the web app is deployed --
      - name: Wait until the API runs this commit
        run: |
          # The API host is the one the web app's rewrite points at.
          api=$(node -e "const v = require('./web/vercel.json'); console.log(new URL(v.rewrites[0].destination).origin)")
          node scripts/wait-for-version.mjs "$api" "$GITHUB_SHA" 300

      - name: Set up pnpm, the version of package.json
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore the pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install the web dependencies
        run: pnpm install --frozen-lockfile

      - name: Take the WASM bundles of the ci job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm-pkg
          path: web/src/wasm/pkg

      # --- 13. Build for Vercel here, without the test key ------------------
      # Vercel builds nothing: its builders have no Rust toolchain. The project
      # is not connected to the Git repository. This step is given no
      # VITE_ENTITLEMENT_TEST_PUBLIC_KEY; `vercel pull` brings the variables
      # of the Vercel project, which must not have one either.
      - name: Build the web app for Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set."
              exit 1
            fi
          done
          vercel="pnpm dlx vercel@$VERCEL_CLI_VERSION"
          $vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          $vercel build --prod --token="$VERCEL_TOKEN"

      # --- 14. The test-key guard (v2implementation D-24) --------------------
      # A build that holds the E2E test key accepts tokens anyone can mint.
      # What `vercel build` wrote is searched for the key, and a build that
      # holds it is not deployed.
      - name: Refuse a build that holds the test key
        run: |
          set -u
          if [ -z "$E2E_TEST_PUBLIC_KEY" ]; then
            echo "::error::E2E_TEST_PUBLIC_KEY is empty, so there is nothing to search for."
            exit 1
          fi
          if [ ! -d .vercel/output ] || [ -z "$(find .vercel/output -type f -print -quit)" ]; then
            echo "::error::vercel build wrote no file to .vercel/output, so there is nothing to search."
            exit 1
          fi
          # grep: 0 when a file holds the key, 1 when none does, 2 when it could not read.
          status=0
          grep --recursive --files-with-matches --fixed-strings -- "$E2E_TEST_PUBLIC_KEY" .vercel/output > "$RUNNER_TEMP/test-key-files.txt" || status=$?
          case "$status" in
            1)
              echo "The test key is in none of the $(find .vercel/output -type f | wc -l) files of .vercel/output."
              ;;
            0)
              echo "::error::The build for production holds the E2E test key. Remove VITE_ENTITLEMENT_TEST_PUBLIC_KEY from the Vercel project and from this job. Nothing was deployed."
              cat "$RUNNER_TEMP/test-key-files.txt"
              exit 1
              ;;
            *)
              echo "::error::The search of .vercel/output failed, so nothing is deployed."
              exit 1
              ;;
          esac

      # --- 15. Deploy what was built and searched, then check it ------------
      - name: Deploy the web app to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: The API answers through the web app's rewrite
        run: node scripts/wait-for-version.mjs "$APP_ORIGIN" "$GITHUB_SHA" 120

      # The headers of the deployment, value for value.
      - name: Headers of the deployment
        run: node scripts/check-headers.mjs "$APP_ORIGIN"

      # Smoke: isolated, WASM compiles under the CSP, API reachable.
      - name: Install Chrome for Playwright
        run: pnpm --filter web exec playwright install --with-deps chrome

      - name: Playwright, the smoke case against the deployment
        env:
          E2E_BASE_URL: ${{ vars.APP_ORIGIN }}
        run: pnpm --filter web exec playwright test --project=non-media --grep @smoke

      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-deployment
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore
