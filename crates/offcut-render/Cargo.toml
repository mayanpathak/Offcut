[package]
name = "offcut-render"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
offcut-types = { workspace = true }
offcut-scene = { workspace = true }
thiserror = { workspace = true }
vello = { workspace = true, features = ["wgpu"] }
wgpu = { workspace = true, features = ["std", "webgpu", "wgsl"] }
# The canvas a frame is drawn to, and the decoded frame that is drawn.
web-sys = { workspace = true, features = ["OffscreenCanvas", "VideoFrame"] }

[dev-dependencies]
# Tests only (v4implementation D-134): the native backends, so that the golden
# frames render on a software adapter (WARP through DX12, lavapipe through
# Vulkan). The normal dependency above keeps `webgpu` only: none of these
# reaches the browser bundle.
wgpu = { workspace = true, features = ["vulkan", "dx12", "wgsl"] }
png = { workspace = true }
