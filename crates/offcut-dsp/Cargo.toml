[package]
name = "offcut-dsp"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
offcut-types = { workspace = true }
# The FFT resampler: synchronous, for a fixed pair of rates.
rubato = { workspace = true, features = ["fft_resampler"] }
thiserror = { workspace = true }
# The denoiser and the loudness meter of the voice chain (v3implementation D-89).
nnnoiseless = { workspace = true }
ebur128 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
# The stamp check of the generated fixtures (v3implementation §6.4).
sha2 = { workspace = true }
# A time map that is not the identity, for `assemble` to refuse: `TimeMap`
# has no other constructor (v4implementation D-164), so the test reads one.
serde_json = { workspace = true }
