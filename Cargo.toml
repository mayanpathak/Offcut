[workspace]
resolver = "2"
members = ["crates/offcut-types", "crates/offcut-api-types", "crates/offcut-wasm-core", "server"]

# Every shared dependency is versioned here, once. Features are set by the crate that uses it.
[workspace.dependencies]
offcut-types = { path = "crates/offcut-types" }
offcut-api-types = { path = "crates/offcut-api-types" }
serde = "1.0.229"
serde_json = "1.0.151"
ts-rs = "12.0.1"
uuid = "1.27.0"
trybuild = "1.0.121"
thiserror = "2.0.21"
axum = "0.8.9"
tokio = "1.53.2"
tower = "0.5.3"
tower-http = "0.7.1"
sqlx = "0.9.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
time = "0.3.55"
sha2 = "0.11.0"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
reqwest = "0.13.5"
# Exact: must equal the installed wasm-bindgen CLI (scripts/build-wasm.sh checks it).
wasm-bindgen = "=0.2.129"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"

[profile.release]
lto = true
codegen-units = 1
# never panic = "abort": the server's CatchPanicLayer needs unwinding
